<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CENTINELA-X | Iniciar sesión</title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="img/CentinelaLogo.png"
    >

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS LOGIN -->
    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <main class="login-page">


        <div class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <img
                    src="img/CentinelaLogo.png"
                    alt="CENTINELA-X"
                >

                <span>
                    CENTINELA-X
                </span>

                <small>
                    SISTEMA INTELIGENTE DE VIGILANCIA
                </small>

            </div>


            <!-- ENCABEZADO -->

            <div class="login-header">

                <span>
                    ACCESO AL SISTEMA
                </span>

                <h1>
                    Iniciar sesión
                </h1>

                <p>
                    Ingresa tus credenciales para acceder
                    al panel de control.
                </p>

            </div>


            <!-- FORMULARIO -->

            <form class="login-form" id="login-form">


                <!-- USUARIO -->

                <div class="form-group">

                    <label for="username">
                        Usuario
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="password-toggle"
                            aria-label="Mostrar contraseña"
                        >

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="login-button"
                >

                    <span>
                        Iniciar sesión
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>


            <!-- MENSAJE -->

            <div
                class="login-message"
                id="login-message"
            ></div>


            <!-- REGRESAR -->

            <a
                href="index.html"
                class="back-link"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Volver al sitio web

            </a>


        </div>


    </main>


</body>

</html>
